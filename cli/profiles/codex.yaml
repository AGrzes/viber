inherit: []
env:
  CODEX_HOME: /codex
volumes:
  "{{env 'HOME'}}/.codex/auth.json": /codex/auth.json:ro
  viber-codex: /codex
templates:
  config:
    path: /codex/config.toml
    template: |-
      {{#if global}}
      {{#each global}}
      {{{@key}}} = {{json this}}
      {{/each}}
      {{/if}}

      {{#if section}}
      {{#each section}}
      [{{{@key}}}]
      {{#each this}}
      {{{@key}}} = {{json this}}
      {{/each}}

      {{/each}}
      {{/if}}
    parameters:
      global:
        sandbox_mode: danger-full-access
        approval_policy: never
        web_search: live
        check_for_update_on_startup: false
        suppress_unstable_features_warning: true
      section:
        features:
          unified_exec: true
          apply_patch_freeform: true
        projects."/workdir":
          trust_level: trusted
  agents:
    path: /codex/AGENTS.md
    template: |-
      {{#each this}}{{this}}
      {{/each}}
